[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tpuperf"
version = "0.1.0"
description = "Cycle-approximate performance and resource model for the tpuv1 INT8 TPU on the AMD Kria KV260"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
tpuperf = "tpuperf.cli:main"

[tool.setuptools]
packages = ["tpuperf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
